name: guitar-tracker-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guitartracker
      POSTGRES_USER: guitartracker
      POSTGRES_PASSWORD: guitartracker
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guitartracker"]
      interval: 2s
      retries: 15
volumes:
  db_data:
