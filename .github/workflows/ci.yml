name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guitartracker
          POSTGRES_USER: guitartracker
          POSTGRES_PASSWORD: guitartracker
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U guitartracker"
          --health-interval 5s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://guitartracker:guitartracker@localhost:5433/guitartracker_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pg_dump 16 (backup tests)
        run: |
          if ! pg_dump --version 2>/dev/null | grep -q ' 16\.'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-16
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
